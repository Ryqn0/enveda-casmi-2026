[project]
name = "casmi26"
version = "0.1.0"
description = "Molecule identification from LC-MS/MS spectra — Enveda CASMI 2026"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "rdkit==2026.3.3",
    "tqdm",
    "matplotlib",
    "kagglehub",
    "kaggle",
    "ms-entropy>=1.5.2",
    "torch>=2.14.0",
    "scikit-learn>=1.9.1",
    "numba>=0.67.0",
]

[project.optional-dependencies]
dev = ["ipykernel", "jupyter", "ruff", "pytest"]
app = [
    "gradio>=6.28.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casmi"]

[tool.ruff]
line-length = 100
